<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cart - SmartStall Global</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-white shadow-md py-4 px-6 flex flex-col md:flex-row md:items-center md:justify-between">
    <h1 class="text-2xl font-bold text-green-600">SmartStall Global</h1>
    <nav class="mt-2 md:mt-0 space-x-4 text-sm md:text-base">
      <a href="index.html" class="text-gray-700 hover:text-green-600">Home</a>
      <a href="products.html" class="text-gray-700 hover:text-green-600">Products</a>
      <a href="cart.html" class="text-gray-700 hover:text-green-600">Cart</a>
      <a href="about.html" class="text-gray-700 hover:text-green-600">About</a>
      <a href="contact.html" class="text-gray-700 hover:text-green-600">Contact</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto mt-10 p-4 bg-white shadow rounded">
    <h2 class="text-2xl font-semibold text-green-700 mb-4 text-center">Your Shopping Cart</h2>
    
    <div id="cart-items" class="space-y-4">
      <p class="text-center text-gray-500">Your cart is currently empty.</p>
    </div>

    <div id="cart-total" class="mt-6 text-xl font-bold text-right text-gray-700">
      Total: KES 0
    </div>

    <div class="flex justify-end mt-6">
      <button onclick="window.location.href='checkout.html'" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">
        Proceed to Checkout
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-12 py-6 bg-white text-center text-sm text-gray-500 border-t">
    <p>&copy; 2025 SmartStall Global</p>
  </footer>

  <!-- JavaScript -->
  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    const cartContainer = document.getElementById('cart-items');
    const totalDisplay = document.getElementById('cart-total');

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function removeItem(index) {
      cart.splice(index, 1);
      saveCart();
      displayCart();
    }

    function addItem(index) {
      const item = cart[index];
      cart.push({ name: item.name, price: item.price });
      saveCart();
      displayCart();
    }

    function displayCart() {
      cartContainer.innerHTML = '';
      if (cart.length === 0) {
        cartContainer.innerHTML = '<p class="text-center text-gray-500">Your cart is currently empty.</p>';
        totalDisplay.textContent = 'Total: KES 0';
        return;
      }

      let total = 0;
      cart.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = "p-4 border rounded shadow-sm bg-gray-50";
        itemDiv.innerHTML = `
          <h3 class="text-lg font-semibold text-gray-800">${item.name}</h3>
          <p class="text-gray-600">Price: KES ${item.price}</p>
          <div class="mt-2 space-x-2">
            <button onclick="addItem(${index})" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">Add More</button>
            <button onclick="removeItem(${index})" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Remove</button>
          </div>
        `;
        cartContainer.appendChild(itemDiv);
        total += item.price;
      });

      totalDisplay.textContent = `Total: KES ${total}`;
    }

    displayCart();
  </script>

</body>
</html>
