<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us - SmartStall Global</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <header class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-700">SmartStall Global</h1>
      <nav class="space-x-4">
        <a href="index.html" class="text-gray-700 hover:text-green-600 font-medium">Home</a>
        <a href="products.html" class="text-gray-700 hover:text-green-600 font-medium">Products</a>
        <a href="cart.html" class="text-gray-700 hover:text-green-600 font-medium">Cart</a>
        <a href="about.html" class="text-gray-700 hover:text-green-600 font-medium">About</a>
        <a href="contact.html" class="text-green-700 font-semibold border-b-2 border-green-700">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10">
    <h2 class="text-3xl font-bold text-center text-green-700 mb-8">Contact Us</h2>
    <form 
      class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md space-y-6"
      onsubmit="event.preventDefault(); alert('Thank you! We will get back to you shortly.')"
    >
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
        <input type="text" id="name" name="name" required
               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Your Email</label>
        <input type="email" id="email" name="email" required
               class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" />
      </div>

      <div>
        <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Your Message</label>
        <textarea id="message" name="message" rows="5" required
                  class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500"></textarea>
      </div>

      <button type="submit"
              class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition duration-200">
        Send Message
      </button>
    </form>
  </main>

  <footer class="bg-white shadow-inner mt-12">
    <div class="text-center text-sm py-4 text-gray-500">
      &copy; 2025 SmartStall Global
    </div>
  </footer>

</body>
</html>
