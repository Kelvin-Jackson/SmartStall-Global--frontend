<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout - SmartStall Global</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-700">SmartStall Global</h1>
      <nav class="space-x-4">
        <a href="index.html" class="text-gray-700 hover:text-green-600 font-medium">Home</a>
        <a href="products.html" class="text-gray-700 hover:text-green-600 font-medium">Products</a>
        <a href="cart.html" class="text-gray-700 hover:text-green-600 font-medium">Cart</a>
        <a href="checkout.html" class="text-green-700 font-semibold border-b-2 border-green-700">Checkout</a>
        <a href="about.html" class="text-gray-700 hover:text-green-600 font-medium">About</a>
        <a href="contact.html" class="text-gray-700 hover:text-green-600 font-medium">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container mx-auto px-4 py-10">
    <h2 class="text-3xl font-bold text-center text-green-700 mb-8">Checkout</h2>

    <form id="checkout-form" class="max-w-3xl mx-auto bg-white shadow-lg rounded-xl p-8 space-y-6">
      <!-- Billing Info -->
      <div>
        <h3 class="text-xl font-semibold text-green-600 mb-4">Billing Information</h3>
        <div class="grid grid-cols-1 gap-4">
          <input type="text" placeholder="Full Name" required class="border border-gray-300 p-3 rounded-lg w-full" />
          <input type="email" placeholder="Email Address" required class="border border-gray-300 p-3 rounded-lg w-full" />
          <input type="text" placeholder="Phone Number" required class="border border-gray-300 p-3 rounded-lg w-full" />
          <input type="text" placeholder="Shipping Address" required class="border border-gray-300 p-3 rounded-lg w-full" />
        </div>
      </div>

      <!-- Payment Method -->
      <div>
        <h3 class="text-xl font-semibold text-green-600 mb-4">Payment Method</h3>
        <div class="space-y-2">
          <label class="flex items-center space-x-2">
            <input type="radio" name="payment" value="mpesa" checked class="accent-green-600" />
            <span>M-Pesa</span>
          </label>
          <label class="flex items-center space-x-2">
            <input type="radio" name="payment" value="card" class="accent-green-600" />
            <span>Credit/Debit Card</span>
          </label>
          <label class="flex items-center space-x-2">
            <input type="radio" name="payment" value="cash" class="accent-green-600" />
            <span>Cash on Delivery</span>
          </label>
        </div>
      </div>

      <!-- Order Summary -->
      <div>
        <h3 class="text-xl font-semibold text-green-600 mb-4">Order Summary</h3>
        <div id="order-summary" class="bg-gray-100 p-4 rounded-lg">
          <p class="mb-2">Items: <strong id="total-items" class="text-green-700">0</strong></p>
          <p>Total: <strong id="total-amount" class="text-green-700">KES 0</strong></p>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white text-lg font-semibold py-3 rounded-lg transition duration-300">
        Place Order
      </button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-white shadow-inner mt-12">
    <div class="text-center text-sm py-4 text-gray-500">
      &copy; 2025 SmartStall Global
    </div>
  </footer>

  <!-- Script -->
  <script>
    // Fetch cart summary from localStorage
    document.getElementById('total-items').innerText = localStorage.getItem('cartCount') || '0';
    document.getElementById('total-amount').innerText = 'KES ' + (localStorage.getItem('cartTotal') || '0');

    document.getElementById('checkout-form').addEventListener('submit', function (e) {
      e.preventDefault();
      alert("Thank you! Your order has been placed.");
      localStorage.removeItem('cartCount');
      localStorage.removeItem('cartTotal');
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
